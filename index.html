<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MoM Flood Alert Map</title>
  <link rel="icon" type="image/png" href="assets/bluh-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>
</head>
<body>
<header id="brand-header">
  <div class="app-header__brand">
    <a id="brand-logo-link" href="https://www.blu-h.org" target="_blank" rel="noopener" title="Blu-H">
      <img src="assets/bluh-logo-256.png" alt="Blu-H logo">
    </a>
    <h1 id="brand-title">MoM Flood Alert Map</h1>
  </div>
  <div id="snapshot-selector">
    <span id="snapshot-label">Updated on</span>
    <select id="snapshot-select" aria-label="Select snapshot date"></select>
  </div>
</header>

<div id="body-content">
  <aside id="panel">
    <section class="side-panel__section">
      <h4 class="side-panel__heading">About</h4>
      <p class="side-panel__text">This map is illustrating the outputs of Model of Models (MoM) - flood detection tool developed in partnership with NASA's Earth Applied Sciences Disasters program.</p>
    </section>
    <section class="side-panel__section">
      <div id="legend">
        <h4>Alert Level</h4>
        <div class="leg"><div class="swatch" style="background:#e0e0e0;border-color:#aaa"></div>No data</div>
      </div>
    </section>
    <section class="side-panel__section side-panel__section--bottom side-panel__footer">
      <p class="side-panel__text">© 2026 Blu-H ASBL</p>
      <p class="side-panel__text"><a class="side-panel__link" href="mailto:info@blu-h.org">Contact us</a></p>
    </section>
  </aside>
  <button id="panel-toggle" type="button" aria-label="Toggle side panel" title="Toggle side panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="17 6 11 12 17 18"></polyline>
      <polyline points="11 6 5 12 11 18"></polyline>
    </svg>
  </button>
  <div id="map-area">
    <div id="map"></div>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const DEFAULT_VIEW = { lng: 0, lat: 20, zoom: 2 };
const MAX_SNAPSHOTS = 7;

// ── URL hash  (#zoom/lat/lng) ─────────────────────────────────────────────────
function parseHash() {
  const m = /^#([\d.]+)\/([-\d.]+)\/([-\d.]+)$/.exec(location.hash);
  if (!m) return null;
  const zoom = parseFloat(m[1]), lat = parseFloat(m[2]), lng = parseFloat(m[3]);
  if (isNaN(zoom) || isNaN(lat) || isNaN(lng)) return null;
  return { zoom, lat, lng };
}

function updateHash() {
  const { lng, lat } = map.getCenter();
  const zoom = map.getZoom();
  history.replaceState(null, '', `#${zoom.toFixed(2)}/${lat.toFixed(4)}/${lng.toFixed(4)}`);
}

window.addEventListener('hashchange', () => {
  const view = parseHash();
  if (view) map.easeTo({ center: [view.lng, view.lat], zoom: view.zoom });
});

const initialView = parseHash() || DEFAULT_VIEW;

const ALERT_COLOR = {
  Warning:     '#f57c00',
  Watch:       '#fbc02d',
  Advisory:    '#fff176',
  Information: '#43a047',
};
const NO_DATA_COLOR = '#e0e0e0';

// ── PMTiles protocol ──────────────────────────────────────────────────────────
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile.bind(protocol));

// ── Map ───────────────────────────────────────────────────────────────────────
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      osm: {
        type: 'raster',
        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256,
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxzoom: 19,
      },
    },
    layers: [
      { id: 'osm', type: 'raster', source: 'osm' },
    ],
  },
  center: [initialView.lng, initialView.lat],
  zoom: initialView.zoom,
  minZoom: 2,
  maxZoom: 8,
  dragRotate: false,
  pitchWithRotate: false,
  maxPitch: 0,
});

map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
map.on('moveend', updateHash);
function preferredScaleUnit() {
  try {
    const ms = new Intl.Locale(navigator.language).measurementSystem;
    return (ms === 'us' || ms === 'uksystem') ? 'imperial' : 'metric';
  } catch (_) { return 'metric'; }
}
map.addControl(new maplibregl.ScaleControl({ unit: preferredScaleUnit() }), 'bottom-left');

// ── Metadata (updated-at + legend) ────────────────────────────────────────────
function formatUpdatedAt(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}) UTC$/.exec(s);
  if (!m) return s;
  const [, y, mo, d, h, mi] = m;
  const date = new Date(Date.UTC(+y, +mo - 1, +d, +h, +mi));
  const dateStr = date.toLocaleDateString(undefined, { dateStyle: 'medium', timeZone: 'UTC' });
  const timeStr = date.toLocaleTimeString(undefined, { timeStyle: 'short', timeZone: 'UTC', hourCycle: 'h23' });
  return `${dateStr} at ${timeStr} UTC`;
}

// ── Snapshots (pmtiles source swap driven by the header dropdown) ─────────────
function addSnapshotLayers(entry) {
  for (const id of ['ws-highlight-outline', 'ws-highlight', 'ws-outline', 'ws-fill']) {
    if (map.getLayer(id)) map.removeLayer(id);
  }
  if (map.getSource('ws')) map.removeSource('ws');

  map.addSource('ws', { type: 'vector', url: `pmtiles://data/tiles/${entry.file}` });

  map.addLayer({
    id: 'ws-fill',
    type: 'fill',
    source: 'ws',
    'source-layer': 'watersheds',
    paint: {
      'fill-color': [
        'match', ['get', 'alert'],
        'Warning',     '#f57c00',
        'Watch',       '#fbc02d',
        'Advisory',    '#fff176',
        'Information', '#43a047',
        NO_DATA_COLOR
      ],
      'fill-opacity': 0.55,
    },
  });
  map.addLayer({
    id: 'ws-outline',
    type: 'line',
    source: 'ws',
    'source-layer': 'watersheds',
    paint: {
      'line-color': [
        'match', ['get', 'alert'],
        'Warning',     '#e65100',
        'Watch',       '#f57f17',
        'Advisory',    '#f9a825',
        'Information', '#2e7d32',
        '#bdbdbd'
      ],
      'line-width': ['interpolate', ['linear'], ['zoom'], 4, 0.3, 8, 0.8, 12, 1.5],
    },
  });
  map.addLayer({
    id: 'ws-highlight',
    type: 'fill',
    source: 'ws',
    'source-layer': 'watersheds',
    filter: ['==', 'pfaf_id', ''],
    paint: { 'fill-color': '#ffffff', 'fill-opacity': 0.35 },
  });
  map.addLayer({
    id: 'ws-highlight-outline',
    type: 'line',
    source: 'ws',
    'source-layer': 'watersheds',
    filter: ['==', 'pfaf_id', ''],
    paint: { 'line-color': '#ffffff', 'line-width': 2.5 },
  });
}

function selectSnapshot(entry) {
  popup.remove();
  addSnapshotLayers(entry);
}

function initSnapshots(meta) {
  const snapshots = (meta.snapshots || []).slice().sort((a, b) => a.index - b.index).slice(0, MAX_SNAPSHOTS);
  if (!snapshots.length) return;

  const selector = document.getElementById('snapshot-selector');
  const select = document.getElementById('snapshot-select');
  for (const entry of snapshots) {
    const opt = document.createElement('option');
    opt.value = entry.index;
    opt.textContent = formatUpdatedAt(entry.updated_at);
    select.appendChild(opt);
  }
  select.value = snapshots[0].index; // index 0 = most recent
  selector.classList.add('ready');
  selectSnapshot(snapshots[0]);

  select.addEventListener('change', () => {
    const entry = snapshots.find(s => s.index === +select.value);
    selectSnapshot(entry);
  });
}

fetch('data/tiles/metadata.json')
  .then(r => { if (!r.ok) throw new Error(`${r.status}`); return r.json(); })
  .then(meta => {
    const run = () => initSnapshots(meta);
    if (map.loaded()) run(); else map.once('load', run);
    updateLegend();
  })
  .catch(err => console.warn('Could not load snapshot metadata:', err));

function updateLegend() {
  const order = ['Warning', 'Watch', 'Advisory', 'Information'];
  const el = document.getElementById('legend');
  el.innerHTML = '<h4>Alert Level</h4>';

  for (const level of order) {
    const color = ALERT_COLOR[level];
    el.innerHTML += `<div class="leg"><div class="swatch" style="background:${color}"></div>${level}</div>`;
  }
  el.innerHTML += `<div class="leg"><div class="swatch" style="background:#e0e0e0;border-color:#aaa"></div>No data</div>`;
}

// ── Click popup ───────────────────────────────────────────────────────────────
const popup = new maplibregl.Popup({ closeButton: true, maxWidth: '270px' });

map.on('click', 'ws-fill', (e) => {
  const p = e.features[0].properties;
  const alert = p.alert || 'No data';
  const color = ALERT_COLOR[alert] ?? '#999';

  map.setFilter('ws-highlight', ['==', 'pfaf_id', p.pfaf_id]);
  map.setFilter('ws-highlight-outline', ['==', 'pfaf_id', p.pfaf_id]);

  const rows = [
    ['Watershed ID',  p.pfaf_id],
    ['Name',          p.name],
    ['Regions',       p.regions],
    ['Status',        p.status],
    ['Days to peak',  p.days_until_peak != null ? p.days_until_peak : null],
  ].filter(([, v]) => v != null && v !== 'null' && v !== 'None' && v !== '');

  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  popup.setLngLat(e.lngLat).setHTML(`
    <div class="pop-title">${esc(p.name || 'Watershed')}</div>
    <div><span class="pop-badge" style="background:${color}">${esc(alert)}</span></div>
    ${rows.map(([k, v]) =>
      `<div class="pop-row"><span class="pop-key">${esc(k)}</span><span>${esc(v)}</span></div>`
    ).join('')}
  `).addTo(map);
});

popup.on('close', () => {
  map.setFilter('ws-highlight', ['==', 'pfaf_id', '']);
  map.setFilter('ws-highlight-outline', ['==', 'pfaf_id', '']);
});

map.on('mouseenter', 'ws-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
map.on('mouseleave', 'ws-fill', () => { map.getCanvas().style.cursor = ''; });

// ── Side panel toggle ─────────────────────────────────────────────────────────
const panel = document.getElementById('panel');
const panelToggle = document.getElementById('panel-toggle');
panelToggle.addEventListener('click', () => {
  panel.classList.toggle('collapsed');
});

// In portrait viewports, interacting with the map or slider closes the panel
// so it doesn't cover the content underneath.
function isPortrait() { return window.innerWidth <= window.innerHeight; }
function closePanelIfPortrait() {
  if (isPortrait()) panel.classList.add('collapsed');
}
map.on('click', closePanelIfPortrait);
map.on('movestart', (e) => { if (e.originalEvent) closePanelIfPortrait(); }); // only user-initiated moves, not programmatic resize
</script>
</body>
</html>
