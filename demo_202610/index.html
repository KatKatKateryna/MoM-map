<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="UTF-8">
  <title>MoM Flood Alert Map</title>
  <link rel="icon" type="image/png" href="assets/bluh-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>
</head>
<body>
<header id="brand-header">
  <div class="app-header__brand">
    <a id="brand-logo-link" href="https://www.blu-h.org" target="_blank" rel="noopener" title="Blu-H">
      <img src="assets/bluh-logo-256.png" alt="Blu-H logo">
    </a>
    <h1 id="brand-title">MoM Flood Alert Map</h1>
  </div>
  <div id="snapshot-selector">
    <span id="snapshot-label">Updated on</span>
    <select id="snapshot-select" aria-label="Select snapshot date"></select>
  </div>
</header>

<div id="body-content">
  <aside id="panel">
    <section class="side-panel__section">
      <h4 class="side-panel__heading">About</h4>
      <p class="side-panel__text">This map is illustrating the outputs of Model of Models (MoM) - flood detection tool developed in partnership with NASA's Earth Applied Sciences Disasters program.</p>
    </section>
    <section class="side-panel__section">
      <div id="legend">
        <h4>Alert Level</h4>
        <div class="leg"><div class="swatch" style="background:#e0e0e0;border-color:#aaa"></div>No data</div>
      </div>
    </section>
    <section class="side-panel__section side-panel__section--bottom side-panel__footer">
      <p class="side-panel__text">© 2026 Blu-H ASBL</p>
      <p class="side-panel__text"><a class="side-panel__link" href="mailto:info@blu-h.org">Contact us</a></p>
    </section>
  </aside>
  <button id="panel-toggle" type="button" aria-label="Toggle side panel" title="Toggle side panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="17 6 11 12 17 18"></polyline>
      <polyline points="11 6 5 12 11 18"></polyline>
    </svg>
  </button>
  <div id="map-area">
    <div id="map"></div>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const DEFAULT_VIEW = { lng: -94.7339, lat: 28.7264, zoom: 6.47 };
const MAX_SNAPSHOTS = 30;
const DARK_THEME = false;
// Extra pmtiles layers, kept on one line for replace.txt. Each item is a path or { url, name, description, opacity, color, brightness }:
//   ['data/a.pmtiles', { url: ['data/b1.pmtiles', 'data/b2.pmtiles'], name: 'B', opacity: 0.7, color: '#555555' }]
// a url list is drawn as one layer with one toggle; brightness (0..1) darkens raster tiles
// color can also be { gradient: 'depth' } or { category: 'class' } (more options in js/extra-sources.js)
const EXTRA_SOURCES = [];
// Flood depth layers share one ramp, so their colors compare directly
const FLOOD_DEPTH = {
  // Reds, evenly spaced on the log scale
  stops: [0.1, '#fcbba1', 0.6, '#fb6a4a', 4, '#cb181d', 25, '#67000d'],
  scale: 'log',
  unit: 'm',
  decimals: 1,
};
// Listed bottom layer first (the legend shows the top layer first)
// The single models, hidden at first, at the bottom and the end of the legend
/*
EXTRA_SOURCES.push({
  url: 'data/persistent/aqueduct/aqueduct_riverine_rp1000.pmtiles',
  name: 'Riverine flood depth, 1-in-1000 years (Aqueduct)',
  description: 'WRI Aqueduct Floods, historical climate (WATCH 1980), ~1 km.',
  opacity: 0.75,
  values: FLOOD_DEPTH,
  above: true,
  visible: false,
});
EXTRA_SOURCES.push({
  url: 'data/persistent/aqueduct/aqueduct_coastal_rp1000.pmtiles',
  name: 'Coastal flood depth, 1-in-1000 years (Aqueduct)',
  description: 'WRI Aqueduct Floods, historical sea level, ~1 km.',
  opacity: 0.75,
  values: FLOOD_DEPTH,
  above: true,
  visible: false,
});
EXTRA_SOURCES.push({
  url: 'data/persistent/glofas/glofas_rp500_1km.pmtiles',
  name: 'River flood depth, 1-in-500 years (GloFAS)',
  description: 'Copernicus GloFAS flood hazard map, 90 m averaged to ~1 km.',
  opacity: 0.75,
  values: FLOOD_DEPTH,
  above: true,
  visible: false,
});
EXTRA_SOURCES.push({
  url: 'data/persistent/flood_max/flood_extent_1km.pmtiles',
  name: 'Flood extent, any model',
  description: 'Every ~1 km cell flooded in Aqueduct riverine or coastal (1-in-1000 years) ' +
    'or GloFAS (1-in-500 years).',
  opacity: 0.75,
  // A raster of 1s: one color, no slider
  values: { stops: [1, '#e6550d'], slider: false },
  above: true,
  visible: false,
});
*/
EXTRA_SOURCES.push({
  // 30" (~1 km) version of the 250 m source, like the flood layers (scripts/build_river_plains_30s.py)
  url: 'data/persistent/river_plains/river_plains_30s.pmtiles',
  name: 'River floodplains',
  description: 'Global floodplains (GFPLAIN250m, Nardi et al. 2006, 2018), ' +
    'mapped with a geomorphic approach from the NASA SRTM v4.1 elevation model; 250 m averaged to ~1 km.',
  opacity: 0.6,
  // Lifts the tiles' #4a7fb5 to about #f1f5f9, almost white
  brightnessMin: 0.92,
  // Sharp ~1 km pixels when zoomed in past the tiles' zoom 7, not blurred
  resampling: 'nearest',
  // Drawn over the watershed fill, under the watershed borders
  above: true,
  color: '#f1f5f9',
});
// Agriculture, under Population. One layer per WorldCereal product, each its own dark
// green (scripts/build_worldcereal_30s.py). Labels are the dataset's product names
// (<season>_<product>); products joined with + are combined (larger share per cell)
const WORLDCEREAL = 'data/persistent/worldcereal/worldcereal_';
EXTRA_SOURCES.push({
  name: 'Agriculture (WorldCereal 2021)',
  description: 'Share of each ~1 km cell in each class, from the 10 m ESA WorldCereal 2021 ' +
    '(no orchards, plantations or pasture).',
  categories: [
    { url: WORLDCEREAL + 'temporarycrops_30s.pmtiles', label: 'tc-annual_temporarycrops',
      stops: [1, '#74a35f', 30, '#2f6b33', 100, '#0b3d1a'] },
    { url: WORLDCEREAL + 'activecropland_30s.pmtiles',
      label: 'tc-wintercereals_activecropland + tc-maize-main_activecropland + tc-maize-second_activecropland',
      stops: [1, '#7f9f7a', 30, '#3d5f3a', 100, '#16301a'], visible: false },
    { url: WORLDCEREAL + 'wintercereals_30s.pmtiles', label: 'tc-wintercereals_wintercereals',
      stops: [1, '#6aa58a', 30, '#2c6b52', 100, '#0f3b2c'], visible: false },
    { url: WORLDCEREAL + 'springcereals_30s.pmtiles', label: 'tc-springcereals_springcereals',
      stops: [1, '#8fae6a', 30, '#4d7232', 100, '#24420f'], visible: false },
    { url: WORLDCEREAL + 'maize_30s.pmtiles', label: 'tc-maize-main_maize + tc-maize-second_maize',
      stops: [1, '#9aa65a', 30, '#5b6a24', 100, '#2f3a0b'], visible: false },
    { url: WORLDCEREAL + 'irrigation_30s.pmtiles',
      label: 'tc-wintercereals_irrigation + tc-maize-main_irrigation + tc-maize-second_irrigation',
      stops: [1, '#5c9f95', 30, '#22675f', 100, '#073a35'], visible: false },
  ],
  opacity: 0.8,
  // Share of the cell, %; one slider trims every category to the same range
  values: {
    stops: [1, '#74a35f', 30, '#2f6b33', 100, '#0b3d1a'],
    min: 1,
    max: 100,
    unit: '%',
    // Opens hiding cells with under 20%, the left end shows them all
    initialMin: 20,
  },
  above: true,
  visible: false,
});
EXTRA_SOURCES.push({
  url: 'data/persistent/population_1km/population_1km.pmtiles',
  name: 'Population',
  opacity: 0.75,
  // Colored at runtime; the legend slider hides cells outside the chosen range
  values: {
    stops: [0.1, '#fcbba1', 10, '#fb6a4a', 1000, '#cb181d', 100000, '#67000d'],
    // Slider and legend bar: power scale (value ~ position^3), quick through the low values
    scale: 'pow',
    exponent: 3,
    min: 1,
    unit: 'people',
    // Opens trimmed to 200+ people; the slider's left end shows every populated cell
    initialMin: 200,
  },
  // Drawn over the natural layers (floodplains, flood depths)
  above: true,
  visible: false,
});
// Last entry: observed floods on top of everything, population included
EXTRA_SOURCES.push({
  url: 'data/persistent/ai4g/ai4g_flood_1km.pmtiles',
  name: 'Observed floods, 2014-2024 (AI4G)',
  description: 'Flooding seen at least once in Sentinel-1 radar images (Microsoft AI for Good, ' +
    'Nature Communications 2025), 240 m buffer, ~1 km.',
  opacity: 0.8,
  // Classes 1 and 2; flooded in a brighter orange than the flood extent. Class 1 (not
  // assessed: rough terrain, arid or urban) is not drawn and left out of the legend
  values: {
    stops: [1, 'rgba(0,0,0,0)', 2, '#f16913'],
    labels: [null, 'Flooded at least once'],
    slider: false,
  },
  above: true,
  visible: false,
});
</script>
<script src="js/map.js"></script>
<script src="js/watersheds.js"></script>
<script src="js/extra-sources.js"></script>
<script src="js/panel.js"></script>
</body>
</html>
