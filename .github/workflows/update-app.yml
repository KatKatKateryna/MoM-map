# Runs on cron schedule, generates PMTiles from the latest CSV and deploys map.html to the gh-pages branch for GitHub Pages.

name: Update published app

on:
  push:
    branches: 
      - main
    paths:
      - '*.html'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - 'sub_pages/**'
      - '.github/actions/build-demo-pages/**'
      - '.github/actions/remove-stale-demo-pages/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-deploy-app:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v4

      - name: Remove stale demo pages from gh-pages
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/remove-stale-demo-pages
        with:
          deploy-token: ${{ secrets.DEPLOY_PAT }}

      - name: Build demo pages
        uses: ./.github/actions/build-demo-pages

      - name: Prepare deployment
        run: |
          mkdir -p deploy/assets deploy/css deploy/js
          cp index.html                 deploy/index.html
          cp css/styles.css             deploy/css/styles.css
          cp js/*.js                    deploy/js/
          cp assets/*                   deploy/assets/
          for demo in sub_pages/demo_*/; do
            demo="${demo%/}"
            name="$(basename "$demo")"
            if [ -f "$demo/index.html" ]; then
              mkdir -p "deploy/$name"
              cp "$demo/index.html" "deploy/$name/index.html"
            fi
          done
          grep -v "^data/tiles/" .gitignore > deploy/.gitignore || true
          touch deploy/.nojekyll

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.DEPLOY_PAT }}
          branch: gh-pages
          folder: deploy
          clean: false
