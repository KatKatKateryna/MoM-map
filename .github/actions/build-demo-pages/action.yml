name: Build demo pages
description: >
  Copies index.html into every demo_* folder that contains a replace.txt or add.txt,
  then applies that folder's variable overrides and added config lines to the copy.

runs:
  using: composite
  steps:
    - name: Build demo pages
      shell: bash
      run: python3 "${{ github.action_path }}/build_demo_pages.py"
